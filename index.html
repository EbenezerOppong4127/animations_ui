<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animations Gallery</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #0e1015;
    --panel: #161922;
    --panel-2: #1c2030;
    --border: #262b3a;
    --text: #e5e7eb;
    --muted: #8b93a7;
    --accent: #7c8cff;
    --sidebar-w: 240px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    display: flex;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
  }

  /* ---------- Barre latérale ---------- */
  .sidebar {
    flex: none;
    width: var(--sidebar-w);
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
    background: var(--panel);
  }

  .brand {
    padding: 22px 20px 16px;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: .2px;
  }
  .brand small {
    display: block;
    margin-top: 4px;
    font-size: 12px;
    font-weight: 400;
    color: var(--muted);
  }

  /* Recherche */
  .search {
    position: relative;
    margin: 0 10px 8px;
  }
  .search svg {
    position: absolute;
    left: 11px;
    top: 50%;
    width: 15px;
    height: 15px;
    transform: translateY(-50%);
    color: var(--muted);
    pointer-events: none;
  }
  .search input {
    width: 100%;
    padding: 9px 30px 9px 34px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
    font: inherit;
    font-size: 14px;
    outline: none;
    transition: border-color .15s ease;
  }
  .search input::placeholder { color: var(--muted); }
  .search input:focus { border-color: var(--accent); }
  .search input::-webkit-search-cancel-button { display: none; }
  .search kbd {
    position: absolute;
    right: 9px;
    top: 50%;
    transform: translateY(-50%);
    padding: 1px 6px;
    border: 1px solid var(--border);
    border-radius: 4px;
    font: 11px ui-monospace, monospace;
    color: var(--muted);
    pointer-events: none;
  }
  .search input:focus ~ kbd,
  .search input:not(:placeholder-shown) ~ kbd { display: none; }

  /* Filtres par catégorie */
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 0 10px 10px;
  }
  .chips button {
    padding: 4px 10px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 12px;
    cursor: pointer;
    transition: background .15s ease, color .15s ease, border-color .15s ease;
  }
  .chips button:hover { color: var(--text); border-color: var(--muted); }
  .chips button[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: #0e1015;
    font-weight: 600;
  }
  .chips span { opacity: .7; margin-left: 3px; }

  .list .group {
    padding: 12px 12px 6px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .list .group:first-child { padding-top: 4px; }

  .count {
    padding: 0 22px 6px;
    font-size: 12px;
    color: var(--muted);
  }

  .list {
    flex: 1;
    list-style: none;
    padding: 4px 10px 12px;
    overflow-y: auto;
  }

  .empty {
    padding: 14px 12px;
    font-size: 14px;
    color: var(--muted);
  }

  .list mark {
    background: rgba(124, 140, 255, .28);
    color: inherit;
    border-radius: 3px;
  }

  /* Pagination */
  .pager {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 10px;
    border-top: 1px solid var(--border);
  }
  .pager[hidden] { display: none; }
  .pager button {
    min-width: 32px;
    height: 32px;
    padding: 0 8px;
    border: 1px solid transparent;
    border-radius: 7px;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 13px;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .pager button:hover:not(:disabled) { background: var(--panel-2); color: var(--text); }
  .pager button[aria-current="page"] {
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 600;
  }
  .pager button:disabled { opacity: .35; cursor: default; }

  .list button {
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 2px;
    border: none;
    border-radius: 8px;
    background: transparent;
    color: var(--muted);
    font: inherit;
    text-align: left;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .list button:hover { background: var(--panel-2); color: var(--text); }
  .list button[aria-current="true"] {
    background: rgba(124, 140, 255, .14);
    color: var(--accent);
    font-weight: 600;
  }

  /* ---------- Zone principale ---------- */
  .main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    padding: 20px;
    gap: 16px;
  }

  .main h1 {
    font-size: 20px;
    font-weight: 600;
  }
  .main h1 a {
    margin-left: 10px;
    font-size: 13px;
    font-weight: 400;
    color: var(--muted);
  }

  .columns {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  .pane {
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--panel);
    overflow: hidden;
  }

  .pane-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    color: var(--muted);
  }

  .preview {
    flex: 1;
    width: 100%;
    border: none;
    background: #fff;
  }

  .code {
    flex: 1;
    margin: 0;
    padding: 16px;
    overflow: auto;
    background: #0b0d12;
    font: 13px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #c9d1e3;
    tab-size: 2;
  }

  .copy {
    padding: 6px 14px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--panel-2);
    color: var(--text);
    font: inherit;
    font-size: 13px;
    cursor: pointer;
    transition: border-color .15s ease, color .15s ease;
  }
  .copy:hover { border-color: var(--accent); }
  .copy.ok { color: #4ade80; border-color: #4ade80; }

  /* ---------- Responsive ---------- */
  @media (max-width: 900px) {
    body { flex-direction: column; height: auto; }
    .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border); }
    .list { display: flex; align-items: center; gap: 6px; overflow-x: auto; padding-bottom: 8px; }
    .list .group { padding: 0 4px 0 8px; white-space: nowrap; }
    .chips { flex-wrap: nowrap; overflow-x: auto; }
    .chips button { white-space: nowrap; }
    .list button { white-space: nowrap; }
    .main { padding: 16px; }
    .columns { grid-template-columns: 1fr; }
    .preview { min-height: 420px; }
    .code { max-height: 500px; }
  }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="brand">
    Animations Gallery
    <small>Micro-interactions UI</small>
  </div>
  <label class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="search" type="search" placeholder="Rechercher…" autocomplete="off" aria-label="Rechercher une animation">
    <kbd>/</kbd>
  </label>
  <div class="chips" id="chips" role="group" aria-label="Filtrer par catégorie"></div>
  <p class="count" id="count" aria-live="polite"></p>
  <ul class="list" id="list"></ul>
  <nav class="pager" id="pager" aria-label="Pagination"></nav>
</aside>

<main class="main">
  <h1><span id="title"></span><a id="open" href="#" target="_blank" rel="noopener">ouvrir ↗</a></h1>
  <div class="columns">
    <section class="pane">
      <div class="pane-head">Aperçu</div>
      <iframe class="preview" id="preview" title="Aperçu de l'animation"></iframe>
    </section>
    <section class="pane">
      <div class="pane-head">
        <span id="filename">Code source</span>
        <button class="copy" id="copy" type="button">Copier</button>
      </div>
      <pre class="code"><code id="code"></code></pre>
    </section>
  </div>
</main>

<script>
  // Catégories, dans l'ordre d'affichage
  const categories = [
    'Boutons & contrôles',
    'Chargement & feedback',
    'Navigation & cartes',
    'Pages complètes',
  ];

  // Liste des animations : ajoutez une entrée ici pour chaque nouveau fichier.
  // `category` : l'une des catégories ci-dessus.
  // `tags` (facultatif) : mots-clés supplémentaires pris en compte par la recherche.
  const animations = [
    { name: 'Order Confirm',      file: 'order-confirm.html',      category: 'Boutons & contrôles',   tags: 'commande camion livraison colis bouton coche' },
    { name: 'Like Button',        file: 'like-button.html',        category: 'Boutons & contrôles',   tags: 'coeur cœur j\'aime favori particules' },
    { name: 'Ripple Button',      file: 'ripple-button.html',      category: 'Boutons & contrôles',   tags: 'onde bouton material clic' },
    { name: 'Toggle Switch',      file: 'toggle-switch.html',      category: 'Boutons & contrôles',   tags: 'interrupteur on off checkbox formulaire' },
    { name: 'Loading Spinner',    file: 'loading-spinner.html',    category: 'Chargement & feedback', tags: 'chargement attente rotation loader' },
    { name: 'Skeleton Loader',    file: 'skeleton-loader.html',    category: 'Chargement & feedback', tags: 'squelette chargement shimmer carte placeholder' },
    { name: 'Progress Bar',       file: 'progress-bar.html',       category: 'Chargement & feedback', tags: 'progression barre envoi upload pourcentage' },
    { name: 'Toast Notification', file: 'toast-notification.html', category: 'Chargement & feedback', tags: 'notification alerte message snackbar' },
    { name: 'Hamburger Menu',     file: 'hamburger-menu.html',     category: 'Navigation & cartes',   tags: 'menu navigation croix burger mobile' },
    { name: 'Flip Card',          file: 'flip-card.html',          category: 'Navigation & cartes',   tags: 'carte retourner 3d survol hover' },
    { name: 'Landing Hero',       file: 'landing-hero.html',       category: 'Pages complètes',       tags: 'accueil landing hero titre dégradé blobs compteur' },
    { name: 'Scroll Reveal',      file: 'scroll-reveal.html',      category: 'Pages complètes',       tags: 'défilement scroll apparition article blog progression lecture' },
    { name: 'Page Transition',    file: 'page-transition.html',    category: 'Pages complètes',       tags: 'transition rideau navigation site multipage' },
    { name: 'Parallax Scene',     file: 'parallax-scene.html',     category: 'Pages complètes',       tags: 'parallaxe montagnes paysage souris profondeur' },
    { name: 'Pricing Page',       file: 'pricing-page.html',       category: 'Pages complètes',       tags: 'tarifs prix abonnement mensuel annuel cartes' },
    { name: 'Login Page',         file: 'login-page.html',         category: 'Pages complètes',       tags: 'connexion formulaire mot de passe erreur vagues' },
  ];

  const PAGE_SIZE = 8; // nombre d'animations par page dans la barre latérale

  const list = document.getElementById('list');
  const searchInput = document.getElementById('search');
  const countEl = document.getElementById('count');
  const chips = document.getElementById('chips');
  const pager = document.getElementById('pager');
  const title = document.getElementById('title');
  const openLink = document.getElementById('open');
  const preview = document.getElementById('preview');
  const filename = document.getElementById('filename');
  const code = document.getElementById('code');
  const copyBtn = document.getElementById('copy');
  let currentSource = '';
  let requestId = 0;
  let currentFile = '';
  let filtered = animations;
  let page = 1;
  let activeCategory = ''; // '' = toutes

  // Tri par catégorie pour que chaque groupe soit contigu dans la liste
  animations.sort((a, b) => categories.indexOf(a.category) - categories.indexOf(b.category));

  // ---------- Filtres par catégorie ----------

  function renderChips() {
    chips.replaceChildren();
    ['', ...categories].forEach(cat => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = cat || 'Toutes';
      const n = document.createElement('span');
      n.textContent = cat ? animations.filter(a => a.category === cat).length : animations.length;
      b.appendChild(n);
      b.setAttribute('aria-pressed', cat === activeCategory);
      b.addEventListener('click', () => {
        activeCategory = cat;
        renderChips();
        applySearch();
      });
      chips.appendChild(b);
    });
  }

  // ---------- Recherche ----------

  // Minuscules + suppression des accents : « coeur » trouve « cœur », « reseau » trouve « réseau »
  const normalize = str => str.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/œ/g, 'oe');

  function applySearch() {
    const terms = normalize(searchInput.value.trim()).split(/\s+/).filter(Boolean);
    filtered = animations.filter(anim => {
      if (activeCategory && anim.category !== activeCategory) return false;
      const haystack = normalize([anim.name, anim.file, anim.category, anim.tags || ''].join(' '));
      return terms.every(t => haystack.includes(t));
    });
    // Reste sur la page de l'animation affichée si elle fait partie des résultats
    const index = filtered.findIndex(a => a.file === currentFile);
    page = index >= 0 ? Math.floor(index / PAGE_SIZE) + 1 : 1;
    render();
  }

  // Surligne les termes recherchés dans le nom (construit en DOM, sans innerHTML)
  function highlight(el, text) {
    const terms = normalize(searchInput.value.trim()).split(/\s+/).filter(Boolean);
    const norm = normalize(text);
    const marks = new Array(text.length).fill(false);
    // normalize() conserve la longueur pour ces noms (pas de ligature œ) : indices alignés
    if (norm.length === text.length) {
      terms.forEach(t => {
        let i = norm.indexOf(t);
        while (i !== -1) {
          for (let k = i; k < i + t.length; k++) marks[k] = true;
          i = norm.indexOf(t, i + t.length);
        }
      });
    }
    let i = 0;
    while (i < text.length) {
      let j = i;
      while (j < text.length && marks[j] === marks[i]) j++;
      const chunk = text.slice(i, j);
      if (marks[i]) {
        const m = document.createElement('mark');
        m.textContent = chunk;
        el.appendChild(m);
      } else {
        el.appendChild(document.createTextNode(chunk));
      }
      i = j;
    }
  }

  // ---------- Liste + pagination ----------

  function render() {
    const pages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
    page = Math.min(Math.max(1, page), pages);
    const start = (page - 1) * PAGE_SIZE;
    const visible = filtered.slice(start, start + PAGE_SIZE);

    list.replaceChildren();
    if (!filtered.length) {
      const li = document.createElement('li');
      li.className = 'empty';
      li.textContent = 'Aucune animation trouvée.';
      list.appendChild(li);
    }
    let lastCategory = null;
    visible.forEach(anim => {
      // Titre de groupe à chaque changement de catégorie
      if (anim.category !== lastCategory) {
        lastCategory = anim.category;
        const h = document.createElement('li');
        h.className = 'group';
        h.textContent = anim.category;
        list.appendChild(h);
      }
      const li = document.createElement('li');
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.dataset.file = anim.file;
      btn.setAttribute('aria-current', anim.file === currentFile);
      highlight(btn, anim.name);
      btn.addEventListener('click', () => { location.hash = anim.file; });
      li.appendChild(btn);
      list.appendChild(li);
    });

    countEl.textContent = searchInput.value.trim() || activeCategory
      ? `${filtered.length} résultat${filtered.length > 1 ? 's' : ''} sur ${animations.length}`
      : `${animations.length} animations`;

    renderPager(pages);
  }

  function renderPager(pages) {
    pager.replaceChildren();
    pager.hidden = pages <= 1;
    if (pages <= 1) return;

    const make = (label, target, opts = {}) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = label;
      if (opts.aria) b.setAttribute('aria-label', opts.aria);
      if (opts.current) b.setAttribute('aria-current', 'page');
      b.disabled = !!opts.disabled;
      b.addEventListener('click', () => { page = target; render(); });
      pager.appendChild(b);
    };

    make('‹', page - 1, { aria: 'Page précédente', disabled: page === 1 });
    for (let p = 1; p <= pages; p++) {
      make(String(p), p, { aria: `Page ${p}`, current: p === page });
    }
    make('›', page + 1, { aria: 'Page suivante', disabled: page === pages });
  }

  renderChips();
  searchInput.addEventListener('input', applySearch);

  searchInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && filtered.length) {
      // Entrée : ouvre le premier résultat de la page affichée
      location.hash = filtered[(page - 1) * PAGE_SIZE].file;
    } else if (e.key === 'Escape') {
      searchInput.value = '';
      applySearch();
      searchInput.blur();
    }
  });

  // « / » place le curseur dans la recherche
  document.addEventListener('keydown', e => {
    if (e.key === '/' && document.activeElement !== searchInput) {
      e.preventDefault();
      searchInput.focus();
    }
  });

  async function select(anim) {
    const path = 'animations/' + anim.file;
    const id = ++requestId;

    currentFile = anim.file;
    // Affiche la page qui contient l'animation sélectionnée
    const index = filtered.findIndex(a => a.file === anim.file);
    if (index >= 0) page = Math.floor(index / PAGE_SIZE) + 1;
    render();
    title.textContent = anim.name;
    document.title = anim.name + ' · Animations Gallery';
    openLink.href = path;
    filename.textContent = anim.file;
    preview.src = path;
    code.textContent = 'Chargement…';
    currentSource = '';

    try {
      const res = await fetch(path);
      if (!res.ok) throw new Error(res.status + ' ' + res.statusText);
      const text = await res.text();
      if (id !== requestId) return; // une autre animation a été sélectionnée entre-temps
      currentSource = text;
      code.textContent = text; // textContent : le HTML est affiché brut, jamais interprété
    } catch (err) {
      if (id !== requestId) return;
      code.textContent =
        'Impossible de charger le code source (' + err.message + ').\n\n' +
        'fetch() ne fonctionne pas en file:// — lancez un serveur local :\n' +
        '  python3 -m http.server 8000\n' +
        'puis ouvrez http://localhost:8000';
    }
  }

  function route() {
    const file = decodeURIComponent(location.hash.slice(1));
    select(animations.find(a => a.file === file) || animations[0]);
  }

  // Copie dans le presse-papiers (avec repli pour les contextes non sécurisés)
  copyBtn.addEventListener('click', async () => {
    if (!currentSource) return;
    try {
      await navigator.clipboard.writeText(currentSource);
    } catch {
      const ta = document.createElement('textarea');
      ta.value = currentSource;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    copyBtn.textContent = 'Copié ✓';
    copyBtn.classList.add('ok');
    clearTimeout(copyBtn._t);
    copyBtn._t = setTimeout(() => {
      copyBtn.textContent = 'Copier';
      copyBtn.classList.remove('ok');
    }, 1500);
  });

  window.addEventListener('hashchange', route);
  route();
</script>
</body>
</html>
