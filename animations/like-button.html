<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Like Button</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #1a1320;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  .like {
    position: relative;
    width: 96px;
    height: 96px;
    border: none;
    border-radius: 50%;
    background: #2a1f33;
    cursor: pointer;
    display: grid;
    place-items: center;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .35);
    -webkit-tap-highlight-color: transparent;
  }
  .like:focus-visible { outline: 2px solid #f472b6; outline-offset: 4px; }

  .heart {
    width: 46px;
    height: 46px;
    position: relative;
    z-index: 1;
  }
  .heart path {
    fill: transparent;
    stroke: #a8a1b3;
    stroke-width: 2;
    transition: fill .25s ease, stroke .25s ease;
  }
  .like.liked .heart path { fill: #ef4444; stroke: #ef4444; }
  .like.liked .heart { animation: pop .45s cubic-bezier(.17, .89, .32, 1.49); }

  /* Anneau qui s'étend */
  .ring {
    position: absolute;
    inset: 18px;
    border-radius: 50%;
    border: 3px solid #f472b6;
    opacity: 0;
    pointer-events: none;
  }
  .like.burst .ring { animation: ring .5s ease-out; }

  /* Particules */
  .particle {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 8px;
    height: 8px;
    margin: -4px 0 0 -4px;
    border-radius: 50%;
    background: var(--c);
    opacity: 0;
    pointer-events: none;
  }
  .like.burst .particle { animation: particle .6s ease-out forwards; }

  @keyframes pop {
    0%   { transform: scale(1); }
    30%  { transform: scale(.6); }
    65%  { transform: scale(1.3); }
    100% { transform: scale(1); }
  }
  @keyframes ring {
    0%   { opacity: 1; transform: scale(.4); border-width: 10px; }
    100% { opacity: 0; transform: scale(1.6); border-width: 0; }
  }
  @keyframes particle {
    0%   { opacity: 1; transform: rotate(var(--a)) translateY(0) scale(1); }
    70%  { opacity: 1; }
    100% { opacity: 0; transform: rotate(var(--a)) translateY(-62px) scale(.2); }
  }

  .count {
    margin-top: 18px;
    text-align: center;
    color: #d6cfe0;
    font-size: 15px;
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>

<div>
  <button class="like" type="button" aria-pressed="false" aria-label="J'aime">
    <span class="ring"></span>
    <svg class="heart" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 20.5s-7.5-4.6-9.3-9.2C1.5 8.2 3.4 4.5 7 4.5c2.1 0 3.6 1.2 5 3 1.4-1.8 2.9-3 5-3 3.6 0 5.5 3.7 4.3 6.8-1.8 4.6-9.3 9.2-9.3 9.2z"/>
    </svg>
  </button>
  <p class="count"><span id="count">128</span> j'aime</p>
</div>

<script>
  const btn = document.querySelector('.like');
  const countEl = document.getElementById('count');
  const colors = ['#ef4444', '#f472b6', '#facc15', '#a78bfa', '#38bdf8', '#fb923c'];
  const PARTICLES = 12;

  // Création des particules réparties sur un cercle
  for (let i = 0; i < PARTICLES; i++) {
    const p = document.createElement('span');
    p.className = 'particle';
    p.style.setProperty('--a', `${(360 / PARTICLES) * i}deg`);
    p.style.setProperty('--c', colors[i % colors.length]);
    btn.appendChild(p);
  }

  btn.addEventListener('click', () => {
    const liked = btn.classList.toggle('liked');
    btn.setAttribute('aria-pressed', liked);
    countEl.textContent = Number(countEl.textContent) + (liked ? 1 : -1);

    btn.classList.remove('burst');
    if (liked) {
      void btn.offsetWidth; // force un reflow pour relancer l'animation
      btn.classList.add('burst');
    }
  });
</script>
</body>
</html>
