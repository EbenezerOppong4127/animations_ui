<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toast Notification</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #111318;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }

  .trigger {
    padding: 14px 26px;
    border: none;
    border-radius: 10px;
    background: #6366f1;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(99, 102, 241, .35);
    transition: transform .15s ease, background .2s ease;
  }
  .trigger:hover { background: #4f46e5; }
  .trigger:active { transform: scale(.96); }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 280px;
    max-width: calc(100% - 32px);
    padding: 14px 18px;
    border-radius: 12px;
    background: #1e2230;
    color: #e2e8f0;
    font-size: 14px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, .45), inset 0 0 0 1px rgba(255, 255, 255, .06);
    overflow: hidden;
    transform: translate(-50%, 140%);
    opacity: 0;
    transition: transform .45s cubic-bezier(.21, 1.02, .73, 1), opacity .45s ease;
  }
  .toast.show {
    transform: translate(-50%, 0);
    opacity: 1;
  }

  .toast .icon {
    flex: none;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: #22c55e;
    display: grid;
    place-items: center;
  }
  .toast .icon svg { width: 14px; height: 14px; }

  /* Barre de temps restant */
  .toast .timer {
    position: absolute;
    left: 0;
    bottom: 0;
    height: 3px;
    width: 100%;
    background: #22c55e;
    transform-origin: left;
    transform: scaleX(0);
  }
  .toast.show .timer { animation: timer var(--life) linear forwards; }

  @keyframes timer {
    from { transform: scaleX(1); }
    to   { transform: scaleX(0); }
  }
</style>
</head>
<body>

<button class="trigger" type="button">Afficher la notification</button>

<div class="toast" role="status" aria-live="polite">
  <span class="icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
  </span>
  <span>Modifications enregistrées avec succès.</span>
  <span class="timer"></span>
</div>

<script>
  const toast = document.querySelector('.toast');
  const LIFE = 2500; // durée d'affichage en ms
  let hideTimer;

  toast.style.setProperty('--life', LIFE + 'ms');

  document.querySelector('.trigger').addEventListener('click', () => {
    clearTimeout(hideTimer);
    toast.classList.remove('show');
    void toast.offsetWidth; // relance la barre de temps si on reclique
    toast.classList.add('show');
    hideTimer = setTimeout(() => toast.classList.remove('show'), LIFE);
  });
</script>
</body>
</html>
