<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ripple Button</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 16px;
    background: #fafaf9;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  .ripple-btn {
    position: relative;
    overflow: hidden;
    padding: 16px 34px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: .3px;
    cursor: pointer;
    transition: box-shadow .2s ease, transform .1s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .ripple-btn:active { transform: translateY(1px); }

  .ripple-btn.primary {
    background: #0d9488;
    color: #fff;
    box-shadow: 0 6px 18px rgba(13, 148, 136, .35);
  }
  .ripple-btn.primary:hover { box-shadow: 0 8px 24px rgba(13, 148, 136, .45); }

  .ripple-btn.outline {
    background: transparent;
    color: #0d9488;
    box-shadow: inset 0 0 0 2px #0d9488;
  }

  .ripple {
    position: absolute;
    border-radius: 50%;
    background: currentColor;
    opacity: .35;
    transform: scale(0);
    pointer-events: none;
    animation: ripple .6s ease-out forwards;
  }

  @keyframes ripple {
    to { transform: scale(1); opacity: 0; }
  }
</style>
</head>
<body>

<button class="ripple-btn primary" type="button">Valider</button>
<button class="ripple-btn outline" type="button">Annuler</button>

<script>
  document.querySelectorAll('.ripple-btn').forEach(btn => {
    btn.addEventListener('pointerdown', e => {
      const rect = btn.getBoundingClientRect();
      // Diamètre suffisant pour couvrir tout le bouton depuis n'importe quel point
      const size = Math.hypot(rect.width, rect.height) * 2;
      const ripple = document.createElement('span');
      ripple.className = 'ripple';
      ripple.style.width = ripple.style.height = size + 'px';
      ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
      ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
      btn.appendChild(ripple);
      ripple.addEventListener('animationend', () => ripple.remove());
    });
  });
</script>
</body>
</html>
