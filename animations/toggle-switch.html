<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toggle Switch</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #0f172a;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #cbd5e1;
  }

  .switch {
    display: inline-flex;
    align-items: center;
    gap: 16px;
    cursor: pointer;
    user-select: none;
    font-size: 16px;
  }

  /* La checkbox native reste accessible mais invisible */
  .switch input {
    position: absolute;
    opacity: 0;
    width: 0;
    height: 0;
  }

  .track {
    position: relative;
    width: 72px;
    height: 40px;
    border-radius: 999px;
    background: #334155;
    box-shadow: inset 0 2px 6px rgba(0, 0, 0, .35);
    transition: background .35s ease;
  }

  .knob {
    position: absolute;
    top: 4px;
    left: 4px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: #f8fafc;
    box-shadow: 0 2px 6px rgba(0, 0, 0, .35);
    transition: transform .35s cubic-bezier(.68, -.35, .27, 1.35), width .2s ease;
  }

  /* Le knob s'étire légèrement pendant l'appui */
  .switch:active .knob { width: 38px; }
  .switch input:checked + .track .knob { transform: translateX(32px); }
  .switch:active input:checked + .track .knob { transform: translateX(26px); }

  .switch input:checked + .track { background: #22c55e; }
  .switch input:focus-visible + .track { outline: 2px solid #38bdf8; outline-offset: 3px; }

  .state {
    width: 32px;
    font-weight: 600;
    transition: color .35s ease;
  }
  .switch input:checked ~ .state { color: #22c55e; }
</style>
</head>
<body>

<label class="switch">
  <input type="checkbox" role="switch" aria-label="Activer">
  <span class="track"><span class="knob"></span></span>
  <span class="state">Off</span>
</label>

<script>
  const input = document.querySelector('.switch input');
  const state = document.querySelector('.state');
  input.addEventListener('change', () => {
    state.textContent = input.checked ? 'On' : 'Off';
  });
</script>
</body>
</html>
