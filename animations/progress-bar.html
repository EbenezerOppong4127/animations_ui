<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Progress Bar</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 16px;
    background: #0c0a1d;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #e2e8f0;
  }

  .uploader {
    width: 360px;
    max-width: 100%;
    padding: 22px;
    border-radius: 16px;
    background: #17142e;
    box-shadow: 0 16px 40px rgba(0, 0, 0, .4);
  }

  .row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 12px;
    font-size: 14px;
  }
  .file { font-weight: 600; }
  .percent {
    font-variant-numeric: tabular-nums;
    color: #a5b4fc;
    font-weight: 700;
  }

  .bar {
    height: 12px;
    border-radius: 999px;
    background: #27234a;
    overflow: hidden;
  }

  .fill {
    height: 100%;
    width: 0%;
    border-radius: inherit;
    background:
      repeating-linear-gradient(-45deg, rgba(255,255,255,.18) 0 8px, transparent 8px 16px),
      linear-gradient(90deg, #6366f1, #a855f7, #ec4899);
    background-size: 22.6px 22.6px, 100% 100%;
    animation: stripes .8s linear infinite;
    transition: width .25s ease-out, background .3s ease;
  }
  .uploader.done .fill {
    background: #22c55e;
    animation: none;
  }
  .uploader.done .percent { color: #4ade80; }

  @keyframes stripes {
    to { background-position: 22.6px 0, 0 0; }
  }

  .status {
    margin-top: 12px;
    font-size: 13px;
    color: #94a3b8;
    min-height: 1.2em;
  }

  .start {
    margin-top: 18px;
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: #6366f1;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .2s ease;
  }
  .start:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>

<div class="uploader">
  <div class="row">
    <span class="file">rapport-annuel.pdf</span>
    <span class="percent">0%</span>
  </div>
  <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <div class="fill"></div>
  </div>
  <p class="status">Prêt à envoyer</p>
  <button class="start" type="button">Envoyer le fichier</button>
</div>

<script>
  const box = document.querySelector('.uploader');
  const fill = box.querySelector('.fill');
  const bar = box.querySelector('.bar');
  const percent = box.querySelector('.percent');
  const status = box.querySelector('.status');
  const start = box.querySelector('.start');

  function setProgress(value) {
    const v = Math.min(100, Math.round(value));
    fill.style.width = v + '%';
    percent.textContent = v + '%';
    bar.setAttribute('aria-valuenow', v);
  }

  start.addEventListener('click', () => {
    let progress = 0;
    start.disabled = true;
    box.classList.remove('done');
    status.textContent = 'Envoi en cours…';
    setProgress(0);

    // Progression irrégulière pour simuler un vrai envoi réseau
    const tick = setInterval(() => {
      progress += Math.random() * 9 + 2;
      setProgress(progress);
      if (progress >= 100) {
        clearInterval(tick);
        box.classList.add('done');
        status.textContent = 'Envoi terminé ✓';
        start.textContent = 'Envoyer à nouveau';
        start.disabled = false;
      }
    }, 180);
  });
</script>
</body>
</html>
