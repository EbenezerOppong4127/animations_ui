<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skeleton Loader</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    gap: 20px;
    padding: 16px;
    background: #f1f5f9;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #0f172a;
  }

  .card {
    width: 320px;
    max-width: 100%;
    padding: 20px;
    border-radius: 16px;
    background: #fff;
    box-shadow: 0 10px 30px rgba(15, 23, 42, .08);
  }

  .header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 18px;
  }

  .avatar {
    flex: none;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: linear-gradient(135deg, #818cf8, #f472b6);
    display: grid;
    place-items: center;
    color: #fff;
    font-weight: 700;
  }

  .name { font-weight: 700; font-size: 15px; }
  .meta { font-size: 13px; color: #64748b; margin-top: 3px; }
  .text { font-size: 14px; line-height: 1.55; color: #334155; }
  .media {
    height: 140px;
    margin-top: 16px;
    border-radius: 10px;
    background: linear-gradient(135deg, #38bdf8, #6366f1);
  }

  /* --- Squelette : formes grises + reflet qui glisse --- */
  .card.loading .avatar,
  .card.loading .name,
  .card.loading .meta,
  .card.loading .text,
  .card.loading .media {
    color: transparent;
    background: #e2e8f0;
    border-radius: 8px;
    position: relative;
    overflow: hidden;
  }
  .card.loading .avatar { border-radius: 50%; }
  .card.loading .name { width: 140px; height: 14px; }
  .card.loading .meta { width: 90px; height: 11px; }
  .card.loading .text { height: 58px; }
  .card.loading .media { border-radius: 10px; }

  .card.loading .avatar::after,
  .card.loading .name::after,
  .card.loading .meta::after,
  .card.loading .text::after,
  .card.loading .media::after {
    content: "";
    position: absolute;
    inset: 0;
    transform: translateX(-100%);
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .75), transparent);
    animation: shimmer 1.3s ease-in-out infinite;
  }

  /* Apparition douce du contenu réel */
  .card:not(.loading) .header,
  .card:not(.loading) .text,
  .card:not(.loading) .media { animation: fade-in .5s ease both; }
  .card:not(.loading) .text  { animation-delay: .08s; }
  .card:not(.loading) .media { animation-delay: .16s; }

  @keyframes shimmer {
    to { transform: translateX(100%); }
  }
  @keyframes fade-in {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: none; }
  }

  .reload {
    padding: 10px 20px;
    border: 1px solid #cbd5e1;
    border-radius: 999px;
    background: #fff;
    color: #334155;
    font-size: 14px;
    cursor: pointer;
  }
  .reload:hover { background: #f8fafc; }
</style>
</head>
<body>

<article class="card loading" aria-busy="true">
  <div class="header">
    <div class="avatar">AL</div>
    <div>
      <div class="name">Ada Lovelace</div>
      <div class="meta">il y a 5 minutes</div>
    </div>
  </div>
  <p class="text">Les skeleton screens donnent une idée de la mise en page pendant le chargement et réduisent la sensation d'attente.</p>
  <div class="media"></div>
</article>

<button class="reload" type="button">Recharger</button>

<script>
  const card = document.querySelector('.card');
  let timer;

  function load() {
    clearTimeout(timer);
    card.classList.add('loading');
    card.setAttribute('aria-busy', 'true');
    // Simule une requête réseau de 2 secondes
    timer = setTimeout(() => {
      card.classList.remove('loading');
      card.setAttribute('aria-busy', 'false');
    }, 2000);
  }

  document.querySelector('.reload').addEventListener('click', load);
  load();
</script>
</body>
</html>
